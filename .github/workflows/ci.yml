name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Design tokens are in sync
        run: python3 scripts/sync_tokens.py --check
      - name: HTML, links, meta, and copy rules
        run: python3 scripts/check_site.py
      - name: preview.sh parses
        run: bash -n scripts/preview.sh
