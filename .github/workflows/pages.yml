name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Docs Python
        run: |
          repo=$(sed -n 's/^repository=//p' sources/graph-ted-db.ref | head -n1)
          git clone --quiet --filter=blob:none "$repo" ../graph-ted-db
          python3 -m venv ../graph-ted-db/.venv
          commit=$(sed -n 's/^commit=//p' sources/graph-ted-db.ref | head -n1)
          git -C ../graph-ted-db show "$commit:requirements-docs.txt" > /tmp/req-docs.txt
          ../graph-ted-db/.venv/bin/pip install -q -r /tmp/req-docs.txt
      - name: Build site
        run: scripts/build_site.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
